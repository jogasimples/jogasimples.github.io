<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShangMing</title>
<meta name="description" content="Site oficial do ShangMing — criador de conteúdo português. Encontra as redes sociais, códigos de parceiros, giveaways exclusivos e muito mais.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrapper">

  <div class="bg-grid" aria-hidden="true"></div>

  <section class="profile">
    <a id="avatar-link" class="avatar-ring" href="#">
      <span class="avatar" id="avatar">TV</span>
    </a>

    <ul class="socials" id="socials"></ul>

    <div class="profile-text">
      <p class="profile-name" id="profile-name"></p>
      <p class="profile-disclaimer" id="profile-disclaimer"></p>
    </div>
  </section>

  <section class="partners">
    <div class="partners-grid" id="partners-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="footer-divider"></div>

    <div class="footer-top">
      <span class="badge-safe"><span class="dot-pulse"></span><span id="footer-badge"></span></span>
      <p class="footer-text" id="footer-text"></p>
    </div>

    <div class="help-links" id="help-links"></div>

    <div class="footer-bottom">
      <p class="footer-disclaimer" id="footer-disclaimer"></p>
      <div class="footer-meta">
        <span class="meta-18">18+</span>
        <span>|</span>
        <span>T&amp;C</span>
        <span>|</span>
        <span id="footer-sitename"></span>
        <span>|</span>
        <span class="meta-version" id="footer-version"></span>
      </div>
    </div>
  </footer>

</main>

<script src="script.js"></script>
  jkjhkh
</body>
</html>
